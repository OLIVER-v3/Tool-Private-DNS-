<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>JX · Private DNS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <svg class="orbit" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#00d4ff"/>
          <stop offset="1" stop-color="#0040ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="ring r1"><ellipse cx="400" cy="400" rx="360" ry="130" fill="none" stroke="url(#og)" stroke-width="3"/></g>
      <g class="ring r2"><ellipse cx="400" cy="400" rx="300" ry="95" fill="none" stroke="url(#og)" stroke-width="1.5"/></g>
    </svg>
    <i class="grain"></i>
  </div>

  <header class="titlebar">
    <div class="brand">
      <span class="logo-tile"><img src="../assets/logo.png" alt="JX"></span>
      <div class="brand-text"><strong>JX</strong><small data-i18n="appSub"></small></div>
    </div>
    <div class="tools">
      <label class="lang-wrap" data-i18n-title="language">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <select id="lang" aria-label="Language">
          <option value="en">English</option>
          <option value="km">ខ្មែរ</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button id="themeLight" data-theme-set="light" data-i18n-title="day">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="themeDark" data-theme-set="dark" data-i18n-title="night">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
      </div>
      <span class="sep"></span>
      <button class="win-btn" id="btnMin" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="win-btn" id="btnMax" aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <button class="win-btn close" id="btnClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <div id="adminBanner" class="banner" hidden data-i18n="needAdmin"></div>

  <main>
    <section class="col">
      <div class="card">
        <h2 data-i18n="connection"></h2>
        <label class="field">
          <span data-i18n="adapter"></span>
          <select id="adapter"></select>
        </label>
        <div class="current">
          <span class="muted" data-i18n="currentDns"></span>
          <div id="currentDns" class="chips"></div>
          <span id="currentName" class="pill"></span>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnApply" data-i18n="apply"></button>
          <button class="btn" id="btnReset" data-i18n="reset"></button>
          <button class="btn" id="btnFlush" data-i18n="flush"></button>
        </div>
      </div>

      <div class="card grow">
        <h2 data-i18n="log"></h2>
        <div id="log" class="log"></div>
      </div>
    </section>

    <section class="col">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="providers"></h2>
          <div class="head-actions">
            <button class="btn small" id="btnTest" data-i18n="testSpeed"></button>
            <button class="btn small" id="btnFastest" data-i18n="useFastest" disabled></button>
          </div>
        </div>
        <div id="providers" class="providers"></div>
      </div>

      <div class="card">
        <h2 data-i18n="custom"></h2>
        <div class="row2">
          <label class="field"><span data-i18n="primary"></span><input id="dns1" placeholder="1.1.1.1" spellcheck="false"></label>
          <label class="field"><span data-i18n="secondary"></span><input id="dns2" placeholder="1.0.0.1" spellcheck="false"></label>
        </div>
        <label class="toggle">
          <input type="checkbox" id="useDoh">
          <i></i>
          <span data-i18n="doh"></span>
        </label>
        <label class="field" id="dohWrap">
          <span>DoH URL</span>
          <input id="dohUrl" placeholder="https://cloudflare-dns.com/dns-query" spellcheck="false">
        </label>
        <div class="row-save">
          <input id="profileName" data-i18n-ph="profileName" spellcheck="false">
          <button class="btn small" id="btnSave" data-i18n="saveProfile"></button>
        </div>
        <div id="profiles" class="profiles"></div>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
